apiVersion: apps/v1
kind: Deployment

metadata:
  name: e-commerce-deployment
  namespace: e-commerce-namespace

spec:
  replicas: 5

  selector:
    matchLabels:
      app: e-commerce-app

  template:
    metadata:
      labels:
        app: e-commerce-app

    spec:
      containers:
        - name: e-commerce-container
          image: amanwankar18/multibranch-flask-app:latest

          ports:
            - containerPort: 5000