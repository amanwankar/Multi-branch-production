
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multibranch-flask-app
  labels:
    app: multibranch-flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multibranch-flask-app
  template:
    metadata:
      labels:
        app: multibranch-flask-app
    spec:
      containers:
        - name: flask-app
          image: multibranch-flask-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
