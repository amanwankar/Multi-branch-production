replicaCount : 2
image:
  repository: multibranch-flask-app
  tag: latest
  pullPolicy: Never

service:
  type: NodePort
  port: 5000
  targetPort: 5000
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
serviceMonitor:
  enabled: true
