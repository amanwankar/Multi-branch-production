apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multibranch-flask.fullname" . }}
  labels:
    {{- include "multibranch-flask.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "multibranch-flask.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "multibranch-flask.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: flask-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
